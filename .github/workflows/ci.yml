# Builds AutoTA and runs all tests on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only builds and tests, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Image the grader runs student code in; the integration test uses it.
      - name: Build grader image
        run: docker build -t autota-grader:latest docker/grader

      # verify = compile, run unit tests, package the jar, then run the Docker
      # integration tests (*IT). AUTOTA_REQUIRE_DOCKER makes them fail instead of skip.
      - run: ./mvnw -B verify
        env:
          AUTOTA_REQUIRE_DOCKER: 'true'

      # On failure, keep the test reports so you can see what broke.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
